services:
  - type: web
    name: healsense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healsense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: healsense-db
    databaseName: healsense
    user: healsense_admin
    plan: free
